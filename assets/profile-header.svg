<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Hongjing Wang.</title>
  <desc id="desc">Building intelligence that acts, adapts, and evolves. Embodied AI, agent harnesses, recursive self-improvement.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17263b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#64e4d3"/><stop offset="1" stop-color="#a7baff"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 H 0 V 28" fill="none" stroke="#8da5c1" stroke-opacity=".065"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <rect x="46" y="49" width="4" height="230" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="73" y="79" fill="#64e4d3" font-size="13" font-weight="600" letter-spacing="3">CURIOSITY / SYSTEMS / EVOLUTION</text>
    <text x="70" y="147" fill="#f1f5fc" font-size="51" font-weight="700">Hi, I'm Hongjing Wang.</text>
    <text x="73" y="193" fill="#c6d3e5" font-size="23">Building intelligence that acts, adapts, and evolves.</text>
    <text x="73" y="252" fill="#89a2c2" font-size="14" letter-spacing="1">EMBODIED AI</text>
    <circle cx="194" cy="247" r="2" fill="#64e4d3"/>
    <text x="210" y="252" fill="#89a2c2" font-size="14" letter-spacing="1">AGENT HARNESS</text>
    <circle cx="357" cy="247" r="2" fill="#64e4d3"/>
    <text x="373" y="252" fill="#89a2c2" font-size="14" letter-spacing="1">RECURSIVE SELF-IMPROVEMENT</text>
  </g>
  <g fill="none" stroke="#a7baff" stroke-opacity=".28">
    <circle cx="1000" cy="159" r="111"/>
    <ellipse cx="1000" cy="159" rx="111" ry="45" transform="rotate(-35 1000 159)"/>
    <ellipse cx="1000" cy="159" rx="111" ry="45" transform="rotate(35 1000 159)"/>
    <path d="M 1000 48 V 270 M 889 159 H 1111" stroke-dasharray="3 7"/>
  </g>
  <circle cx="1000" cy="159" r="28" fill="#64e4d3" fill-opacity=".08"/>
  <circle cx="1000" cy="159" r="9" fill="#64e4d3"/>
  <circle cx="1079" cy="81" r="5" fill="#a7baff"/>
  <circle cx="908" cy="220" r="5" fill="#64e4d3"/>
  <text x="1000" y="303" text-anchor="middle" fill="#7188a6" font-family="Consolas,monospace" font-size="11" letter-spacing="2">PERCEIVE / ACT / LEARN / IMPROVE</text>
